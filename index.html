<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="A simple Hello, world! page for a sample Node.js app."
    />
    <title>Hello, world! | Node.js App</title>
    <style>
      :root {
        color-scheme: light;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI",
          sans-serif;
        font-synthesis: none;
        text-rendering: optimizeLegibility;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
        background: #f3f6fb;
        color: #172033;
      }

      * {
        box-sizing: border-box;
      }

      body {
        display: grid;
        min-height: 100vh;
        margin: 0;
        padding: 24px;
        place-items: center;
      }

      main {
        width: min(100%, 560px);
        padding: 56px 40px;
        border: 1px solid #e3e9f2;
        border-radius: 20px;
        background: #fff;
        box-shadow: 0 18px 50px rgb(23 32 51 / 8%);
        text-align: center;
      }

      .eyebrow {
        margin: 0 0 14px;
        color: #16834a;
        font-size: 0.8rem;
        font-weight: 700;
        letter-spacing: 0.12em;
        text-transform: uppercase;
      }

      h1 {
        margin: 0;
        font-size: clamp(2.5rem, 8vw, 4rem);
        letter-spacing: -0.06em;
        line-height: 1.1;
      }

      main > p:last-child {
        margin: 18px 0 0;
        color: #637087;
        font-size: 1.05rem;
        line-height: 1.6;
      }

      @media (max-width: 480px) {
        main {
          padding: 44px 24px;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <p class="eyebrow">Your Node.js app is running</p>
      <h1>Hello, world!</h1>
      <p>Congratulations! This is a simple sample page. You’re ready to start building.</p>
    </main>
  </body>
</html>
